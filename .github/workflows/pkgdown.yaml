# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, developmental]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  PKGDOWN_CACHE_VERSION: v2
  PKGDOWN_VARIANT: ${{ github.ref_name == 'developmental' && 'developmental' || 'stable' }}
  PKGDOWN_SITE_URL: ${{ github.ref_name == 'developmental' && 'https://genomicsmachinelearning.github.io/SpaMTP/developmental' || 'https://genomicsmachinelearning.github.io/SpaMTP' }}

jobs:
  dependencies:
    name: Prepare dependencies and site shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # GitHub LFS currently cannot serve two historical vignette objects.
          # Checking out all LFS objects makes the workflow fail before R starts.
          lfs: false

      - name: Restore large vignette data
        id: vignette-data
        uses: actions/cache/restore@v4
        with:
          path: |
            vignettes/vignette_data_files/human_brain_tissue_analysis/brain_tumour_integrated.rds
            vignettes/vignette_data_files/human_brain_tissue_analysis/brain_tumour_combined_pathways.rds
          key: pkgdown-vignette-data-zenodo-18282678-v1

      - name: Download unavailable LFS vignette data from Zenodo
        shell: bash
        run: |
          set -euo pipefail

          ensure_file() {
            local path="$1"
            local url="$2"
            local expected_sha256="$3"

            if [[ -f "$path" ]] && echo "$expected_sha256  $path" | sha256sum --check --status; then
              echo "Using cached $path"
              return
            fi

            mkdir -p "$(dirname "$path")"
            curl --location --fail --show-error \
              --retry 5 --retry-all-errors --retry-delay 15 \
              --connect-timeout 30 --max-time 1800 \
              --output "${path}.part" "$url"
            echo "$expected_sha256  ${path}.part" | sha256sum --check
            mv "${path}.part" "$path"
          }

          ensure_file \
            "vignettes/vignette_data_files/human_brain_tissue_analysis/brain_tumour_integrated.rds" \
            "https://zenodo.org/records/18282678/files/brain_tumour_integrated.rds?download=1" \
            "0b946f7f8843502c6675fdb025e0bd29d39d1245ea5083451ea814b7818e551a"
          ensure_file \
            "vignettes/vignette_data_files/human_brain_tissue_analysis/brain_tumour_combined_pathways.rds" \
            "https://zenodo.org/records/18282678/files/brain_tumour_combined_pathways.rds?download=1" \
            "ecbd858c53d577d9aa2c5365ef772edd495f80e4572fec0cc5f74c1618d2903e"

      - name: Save large vignette data
        if: steps.vignette-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vignettes/vignette_data_files/human_brain_tissue_analysis/brain_tumour_integrated.rds
            vignettes/vignette_data_files/human_brain_tissue_analysis/brain_tumour_combined_pathways.rds
          key: pkgdown-vignette-data-zenodo-18282678-v1

      - name: Restore Mouse Brain Visium data
        id: mouse-brain-visium
        uses: actions/cache/restore@v4
        with:
          path: vignettes/vignette_data_files/Mouse_Brain/ST_data/visium.RDS
          key: pkgdown-vignette-data-zenodo-17246900-visium-fe1beef8631cf16d320334ab3694f58f

      - name: Download Mouse Brain Visium data from Zenodo
        shell: bash
        run: |
          set -euo pipefail

          path="vignettes/vignette_data_files/Mouse_Brain/ST_data/visium.RDS"
          expected_md5="fe1beef8631cf16d320334ab3694f58f"
          url="https://zenodo.org/api/records/17246900/files/visium.RDS/content"

          if [[ -f "$path" ]] && echo "$expected_md5  $path" | md5sum --check --status; then
            echo "Using cached $path"
            exit 0
          fi

          mkdir -p "$(dirname "$path")"
          curl --location --fail --show-error \
            --retry 5 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 --max-time 1800 \
            --output "${path}.part" "$url"
          echo "$expected_md5  ${path}.part" | md5sum --check
          mv "${path}.part" "$path"

      - name: Save Mouse Brain Visium data
        if: steps.mouse-brain-visium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vignettes/vignette_data_files/Mouse_Brain/ST_data/visium.RDS
          key: pkgdown-vignette-data-zenodo-17246900-visium-fe1beef8631cf16d320334ab3694f58f

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          # Preserve the installed library even if a later validation or site
          # preparation step fails, so the next push can restore it.
          cache: always

      - name: Parse all vignette chunks
        shell: Rscript {0}
        run: |
          vignette_files <- list.files(
            "vignettes", pattern = "[.]Rmd$", full.names = TRUE
          )
          for (vignette_file in vignette_files) {
            output_file <- tempfile(fileext = ".R")
            knitr::purl(
              vignette_file,
              output = output_file,
              documentation = 0,
              quiet = TRUE
            )
            parse(output_file)
            message("Parsed ", vignette_file)
          }

      - name: Build reusable site shell
        shell: Rscript {0}
        run: |
          override <- list(url = Sys.getenv("PKGDOWN_SITE_URL"))
          if (identical(Sys.getenv("PKGDOWN_VARIANT"), "developmental")) {
            override$home <- list(title = "SpaMTP developmental")
          }
          pkgdown::build_home(
            override = override,
            preview = FALSE,
            quiet = FALSE
          )

      - name: Upload site shell
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site-shell
          path: docs
          if-no-files-found: error
          retention-days: 1

      - name: Stage shared article assets
        shell: Rscript {0}
        run: |
          asset_roots <- c(
            file.path("vignettes", "assets"),
            file.path("vignettes", "vignette_data_files")
          )
          static_files <- system2(
            "git", c("ls-files", "--", asset_roots), stdout = TRUE
          )
          static_files <- unique(static_files[
            grepl(
              "[.](html?|png|jpe?g|gif|svg|webp)$",
              static_files,
              ignore.case = TRUE
            )
          ])
          relative_files <- sub("^vignettes/", "", static_files)
          destinations <- file.path("docs", "articles", relative_files)
          invisible(lapply(
            unique(dirname(destinations)),
            dir.create,
            recursive = TRUE,
            showWarnings = FALSE
          ))
          copied <- file.copy(static_files, destinations, overwrite = TRUE)
          if (!all(copied)) {
            stop(
              "Failed to stage article assets: ",
              paste(static_files[!copied], collapse = ", ")
            )
          }

          # Older cached SpaMTP.html files use the lowercase spelling. Keep an
          # alias while new renders use the source file's canonical case.
          alias_copied <- file.copy(
            file.path("vignettes", "assets", "SM_Analysis.png"),
            file.path("docs", "articles", "assets", "sm_analysis.png"),
            overwrite = TRUE
          )
          if (!alias_copied) {
            stop("Failed to stage the legacy lowercase SM analysis image alias.")
          }
          message(
            "Staged ", length(static_files), " shared article assets (",
            round(sum(file.info(static_files)$size) / 1024^2, 1), " MiB)"
          )

      - name: Upload shared article assets
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-shared-assets
          path: |
            docs/articles/assets
            docs/articles/vignette_data_files
          if-no-files-found: error
          retention-days: 1

  build-vignettes:
    name: Vignette — ${{ matrix.article }}
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        article:
          - SpaMTP
          - Mouse_Urinary_Bladder
          - Multi-Omic_Mouse_Brain
          - human_brain_tissue_analysis
          - SpaMTP_Additional_Features
          - Big_Data
          - Annotation_Refinement
          - Single_Cell_MultiOmics
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The dependency job primes the r-lib cache. Each fresh matrix runner
      # restores that cache here instead of compiling the library from scratch.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Download site shell
        uses: actions/download-artifact@v4
        with:
          name: pkgdown-site-shell
          path: docs

      - name: Restore human brain vignette data
        if: matrix.article == 'human_brain_tissue_analysis'
        uses: actions/cache/restore@v4
        with:
          path: |
            vignettes/vignette_data_files/human_brain_tissue_analysis/brain_tumour_integrated.rds
            vignettes/vignette_data_files/human_brain_tissue_analysis/brain_tumour_combined_pathways.rds
          key: pkgdown-vignette-data-zenodo-18282678-v1

      - name: Restore rendered article
        id: article-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            docs/articles/${{ matrix.article }}.html
            docs/articles/${{ matrix.article }}_files
          key: pkgdown-article-${{ env.PKGDOWN_CACHE_VERSION }}-${{ env.PKGDOWN_VARIANT }}-${{ runner.os }}-${{ matrix.article }}-${{ hashFiles(format('vignettes/{0}.Rmd', matrix.article), 'DESCRIPTION', 'NAMESPACE', 'R/**/*.R', '_pkgdown.yml') }}

      - name: Restore Mouse Brain Visium data
        if: steps.article-cache.outputs.cache-hit != 'true' && matrix.article == 'Multi-Omic_Mouse_Brain'
        uses: actions/cache/restore@v4
        with:
          path: vignettes/vignette_data_files/Mouse_Brain/ST_data/visium.RDS
          key: pkgdown-vignette-data-zenodo-17246900-visium-fe1beef8631cf16d320334ab3694f58f

      - name: Restore partial knitr cache
        id: knitr-cache
        if: steps.article-cache.outputs.cache-hit != 'true' && matrix.article == 'Multi-Omic_Mouse_Brain'
        uses: actions/cache/restore@v4
        with:
          # Keep the historical root path so caches produced by the previous
          # monolithic workflow remain restorable. The vignette itself writes
          # only to its Multi-Omic_Mouse_Brain subdirectory.
          path: vignettes/.knitr-cache
          key: pkgdown-knitr-${{ runner.os }}-${{ matrix.article }}-${{ hashFiles('DESCRIPTION', 'NAMESPACE', 'R/**/*.R') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pkgdown-knitr-${{ runner.os }}-${{ matrix.article }}-${{ hashFiles('DESCRIPTION', 'NAMESPACE', 'R/**/*.R') }}-
            pkgdown-knitr-${{ runner.os }}-

      - name: Build article
        if: steps.article-cache.outputs.cache-hit != 'true'
        env:
          ARTICLE: ${{ matrix.article }}
        shell: Rscript {0}
        run: |
          override <- list(url = Sys.getenv("PKGDOWN_SITE_URL"))
          if (identical(Sys.getenv("PKGDOWN_VARIANT"), "developmental")) {
            override$home <- list(title = "SpaMTP developmental")
          }
          pkgdown::build_article(
            Sys.getenv("ARTICLE"),
            lazy = FALSE,
            new_process = FALSE,
            override = override,
            quiet = FALSE
          )

      # The run-specific key makes every failed attempt a new checkpoint. GitHub
      # cache entries are immutable, so reusing a fixed key would lose progress.
      - name: Save partial knitr cache
        if: always() && steps.article-cache.outputs.cache-hit != 'true' && matrix.article == 'Multi-Omic_Mouse_Brain'
        uses: actions/cache/save@v4
        with:
          path: vignettes/.knitr-cache
          key: pkgdown-knitr-${{ runner.os }}-${{ matrix.article }}-${{ hashFiles('DESCRIPTION', 'NAMESPACE', 'R/**/*.R') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save rendered article
        if: steps.article-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            docs/articles/${{ matrix.article }}.html
            docs/articles/${{ matrix.article }}_files
          key: pkgdown-article-${{ env.PKGDOWN_CACHE_VERSION }}-${{ env.PKGDOWN_VARIANT }}-${{ runner.os }}-${{ matrix.article }}-${{ hashFiles(format('vignettes/{0}.Rmd', matrix.article), 'DESCRIPTION', 'NAMESPACE', 'R/**/*.R', '_pkgdown.yml') }}

      - name: Upload rendered article
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-article-${{ matrix.article }}
          path: |
            docs/articles/${{ matrix.article }}.html
            docs/articles/${{ matrix.article }}_files
          if-no-files-found: error
          retention-days: 1

  assemble-and-deploy:
    name: Assemble and deploy pkgdown
    needs: build-vignettes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Stable and developmental deployments both update gh-pages. Only the
    # final publishing job needs serialization; vignette jobs remain parallel.
    concurrency:
      group: pkgdown-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Download site shell
        uses: actions/download-artifact@v4
        with:
          name: pkgdown-site-shell
          path: docs

      - name: Download shared article assets
        uses: actions/download-artifact@v4
        with:
          name: pkgdown-shared-assets
          path: docs/articles

      - name: Download rendered articles
        uses: actions/download-artifact@v4
        with:
          pattern: pkgdown-article-*
          path: docs/articles
          merge-multiple: true

      - name: Verify article artifacts
        shell: Rscript {0}
        run: |
          articles <- c(
            "SpaMTP",
            "Mouse_Urinary_Bladder",
            "Multi-Omic_Mouse_Brain",
            "human_brain_tissue_analysis",
            "SpaMTP_Additional_Features",
            "Big_Data",
            "Annotation_Refinement",
            "Single_Cell_MultiOmics"
          )
          outputs <- file.path("docs", "articles", paste0(articles, ".html"))
          missing <- outputs[!file.exists(outputs) | file.info(outputs)$size == 0]
          if (length(missing)) {
            stop("Missing rendered article artifacts: ", paste(missing, collapse = ", "))
          }
          # Artifact extraction occurs after checkout, but set the timestamps
          # explicitly so pkgdown lazy mode never re-renders them in this job.
          Sys.setFileTime(outputs, Sys.time())

          missing_references <- character()
          for (article in outputs) {
            document <- xml2::read_html(article)
            references <- c(
              xml2::xml_attr(xml2::xml_find_all(document, ".//*[@src]"), "src"),
              xml2::xml_attr(
                xml2::xml_find_all(document, ".//link[@rel='stylesheet']"),
                "href"
              )
            )
            references <- unique(references[!is.na(references) & nzchar(references)])
            references <- references[
              !grepl("^[A-Za-z][A-Za-z0-9+.-]*:|^//|^#", references)
            ]
            references <- sub("[?#].*$", "", references)
            targets <- file.path(dirname(article), utils::URLdecode(references))
            missing_local <- references[!file.exists(targets)]
            if (length(missing_local)) {
              missing_references <- c(
                missing_references,
                paste0(article, " -> ", missing_local)
              )
            }
          }
          missing_references <- unique(missing_references)
          if (length(missing_references)) {
            stop(
              "Missing local article assets:\n",
              paste(missing_references, collapse = "\n")
            )
          }
          message(
            "Verified ", length(outputs),
            " rendered articles and all local image/iframe dependencies"
          )

      - name: Assemble site without re-rendering articles
        shell: Rscript {0}
        run: |
          override <- list(url = Sys.getenv("PKGDOWN_SITE_URL"))
          if (identical(Sys.getenv("PKGDOWN_VARIANT"), "developmental")) {
            override$home <- list(title = "SpaMTP developmental")
          }
          pkgdown::build_site_github_pages(
            clean = FALSE,
            lazy = TRUE,
            new_process = FALSE,
            install = FALSE,
            override = override
          )

      - name: Deploy stable site to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name != 'developmental'
        uses: JamesIves/github-pages-deploy-action@v4.7.6
        with:
          branch: gh-pages
          folder: docs
          clean: true
          clean-exclude: |
            developmental
            developmental/**
          commit-message: "docs: deploy stable site from ${{ github.ref_name }}"

      - name: Deploy developmental site to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == 'developmental'
        uses: JamesIves/github-pages-deploy-action@v4.7.6
        with:
          branch: gh-pages
          folder: docs
          target-folder: developmental
          clean: true
          commit-message: "docs: deploy developmental site"

      - name: Report developmental documentation URL
        if: github.event_name != 'pull_request' && github.ref_name == 'developmental'
        run: |
          echo "### Developmental documentation" >> "$GITHUB_STEP_SUMMARY"
          echo "https://genomicsmachinelearning.github.io/SpaMTP/developmental/" >> "$GITHUB_STEP_SUMMARY"
